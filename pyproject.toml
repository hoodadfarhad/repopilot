[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "pydantic>=2.12.5",
]

[project.scripts]
repopilot = "repopilot.main:run"
run_crew = "repopilot.main:run"
train = "repopilot.main:train"
replay = "repopilot.main:replay"
test = "repopilot.main:test"
run_with_trigger = "repopilot.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = [
    "sandbox",
]
